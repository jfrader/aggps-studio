name: Release desktop bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plat: windows-x64
          - os: ubuntu-latest
            plat: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag matches the application version
        run: >-
          python -c "import os; from version import APP_VERSION;
          tag = os.environ['GITHUB_REF_NAME'];
          assert tag == f'v{APP_VERSION}', f'tag {tag} does not match v{APP_VERSION}'"

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            at-spi2-core \
            dbus-x11 \
            pkg-config \
            libcairo2-dev \
            gobject-introspection \
            libgirepository1.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            xvfb

      - name: Install desktop and build requirements
        run: python -m pip install -r requirements-build-desktop.txt

      - name: Build desktop bundle
        run: python build_desktop.py

      - name: Verify packaged bundle
        run: python build_desktop.py --verify

      - name: Run packaging verification tests
        run: python -m pytest tests/test_packaging.py -q --tb=line

      - name: Run Linux GUI smoke
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- env -u WAYLAND_DISPLAY GDK_BACKEND=x11 xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            timeout --signal=TERM 20s \
            "./dist/AgGPS Studio/AgGPS Studio" --gui-smoke-test

      - name: Run Windows GUI smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\AgGPS Studio\AgGPS Studio.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Packaged Windows executable not found: $exe"
          }
          & $exe --gui-smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Windows GUI smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.plat }}
          path: dist/aggps-studio-*-${{ matrix.plat }}.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-artifacts/aggps-studio-*-windows-x64.zip
          release-artifacts/aggps-studio-*-linux-x64.zip
          --verify-tag
          --generate-notes
          --title "AgGPS Studio $GITHUB_REF_NAME"
