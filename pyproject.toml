[project]
name = "aggps-studio"
version = "0.4.3"
description = "Trimble AgGPS zip → Case AFS Pro 700 tractor ZIPs + printable taipa maps"
readme = "README.md"
authors = [{ name = "Fran", email = "jfrader@pm.me" }]
license = "GPL-3.0-or-later"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "itsdangerous==2.2.0",
  "matplotlib==3.11.1",
  "pillow==12.3.0",
  "python-multipart==0.0.32",
  "reportlab==5.0.1",
  "requests==2.34.2",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = ["httpx2==2.12.0", "pytest==9.1.1", "platformdirs==4.3.6"]
desktop = [
  "platformdirs==4.3.6",
  'pywebview[gtk]==6.2.1 ; sys_platform == "linux"',
  'pywebview==6.2.1 ; sys_platform == "win32"',
  'pywebview==6.2.1 ; sys_platform != "linux" and sys_platform != "win32"',
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
