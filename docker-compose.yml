services:
  web:
    build: .
    init: true
    ports:
      - "${PORT:-8765}:${PORT:-8765}"
    environment:
      HOST: "${HOST:-0.0.0.0}"
      PORT: "${PORT:-8765}"
      AGGPS_STUDIO_PASSWORD: "${AGGPS_STUDIO_PASSWORD:?Set AGGPS_STUDIO_PASSWORD in .env}"
      AGGPS_SESSION_SECRET: "${AGGPS_SESSION_SECRET:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-50}"
      MAX_EXTRACTED_MB: "${MAX_EXTRACTED_MB:-300}"
      MAX_ZIP_MEMBER_MB: "${MAX_ZIP_MEMBER_MB:-100}"
      MAX_ZIP_MEMBERS: "${MAX_ZIP_MEMBERS:-1000}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-1}"
      MAX_PENDING_JOBS: "${MAX_PENDING_JOBS:-20}"
      JOB_TTL_HOURS: "${JOB_TTL_HOURS:-24}"
      JOB_CLEANUP_INTERVAL_SECONDS: "${JOB_CLEANUP_INTERVAL_SECONDS:-900}"
      SESSION_HOURS: "${SESSION_HOURS:-12}"
      JOBS_DIR: "/data/jobs"
      MPLCONFIGDIR: "/tmp/mpl"
    volumes:
      - jobs:/data/jobs
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 2m
    restart: unless-stopped

volumes:
  jobs:
